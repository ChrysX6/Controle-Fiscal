<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Fiscal - AguiaContab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="tela-login" class="tela-login">
    <div class="login-box">
      <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Aguia Contab" class="login-logo">
      <h2>Controle Fiscal</h2>
      <p>Digite a senha de acesso</p>
      <input type="password" id="input-senha" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter') verificarSenha()">
      <button onclick="verificarSenha()">Entrar</button>
      <p id="erro-senha" class="erro-msg"></p>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="app" class="app-container" style="display:none;">

    <!-- CABEÇALHO FIXO COM LOGO CENTRALIZADA -->
    <header class="header-fixo">
      <div class="header-conteudo">
        <div class="header-lado" id="header-esquerda"></div>
        <div class="header-centro">
          <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Aguia Contab" class="logo-principal">
          <h1>Controle Fiscal</h1>
        </div>
        <div class="header-lado header-direita">
          <button class="btn btn-azul" onclick="abrirPlanilha()">📄 Abrir Planilha</button>
          <button class="btn btn-azul" onclick="mostrarModalNovoMes()">🗓️ Criar Novo Mês</button>
          <button class="btn btn-vermelho" onclick="sair()">🚪 Sair</button>
        </div>
      </div>

      <!-- SELETOR DE MÊS -->
      <div class="barra-meses" id="barra-meses"></div>

      <!-- ABAS DE CATEGORIA -->
      <div class="barra-categorias" id="barra-categorias"></div>
    </header>

    <!-- CONTEÚDO -->
    <main class="conteudo">
      <div class="acoes-topo">
        <button class="btn btn-verde" onclick="mostrarModalAdicionar()">➕ Adicionar Empresa</button>
        <span id="status-salvamento" class="status-salvamento"></span>
      </div>

      <div class="tabela-scroll-wrapper">
        <div class="tabela-scroll">
          <table id="tabela-empresas">
            <thead id="tabela-head"></thead>
            <tbody id="tabela-body">
              <tr><td class="carregando">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL ADICIONAR EMPRESA -->
  <div id="modal-adicionar" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>Adicionar Empresa</h3>
      <div id="form-adicionar-campos" class="form-campos"></div>
      <div class="modal-botoes">
        <button class="btn btn-verde" onclick="confirmarAdicionarEmpresa()">Adicionar</button>
        <button class="btn btn-cinza" onclick="fecharModalAdicionar()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL NOVO MÊS -->
  <div id="modal-novo-mes" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>Criar Novo Mês</h3>
      <p>Digite o nome do novo mês (ex: SETEMBRO):</p>
      <input type="text" id="input-novo-mes" placeholder="SETEMBRO">
      <div class="modal-botoes">
        <button class="btn btn-verde" onclick="confirmarNovoMes()">Criar</button>
        <button class="btn btn-cinza" onclick="fecharModalNovoMes()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="meses.js"></script>
  <script src="script.js"></script>
</body>
</html>

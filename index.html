<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Fiscal - AguiaContab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== TELA DE LOGIN ===================== -->
  <div id="tela-login" class="tela-login">
    <div class="caixa-login">
      <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Logo AguiaContab" class="logo-login">
      <h2>Controle Fiscal</h2>
      <p>Digite a senha de acesso para continuar</p>
      <input type="password" id="input-senha" placeholder="Senha de acesso" autocomplete="off">
      <button id="btn-entrar">Entrar</button>
      <p id="erro-login" class="erro-login"></p>
    </div>
  </div>

  <!-- ===================== SITE PRINCIPAL ===================== -->
  <div id="app" class="app oculto">

    <header class="cabecalho">
      <div class="cabecalho-esquerda">
        <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Logo AguiaContab" class="logo-topo">
        <h1>Controle Fiscal</h1>
      </div>
      <div class="cabecalho-direita">
        <button id="btn-abrir-planilha" class="botao-secundario">📄 Abrir Planilha</button>
        <button id="btn-novo-mes" class="botao-secundario">🗓️ Criar Novo Mês</button>
        <button id="btn-sair" class="botao-perigo">Sair</button>
      </div>
    </header>

    <nav class="nav-meses" id="nav-meses"></nav>

    <nav class="nav-categorias" id="nav-categorias"></nav>

    <div class="painel-acoes">
      <button id="btn-add-empresa" class="botao-primario">➕ Adicionar Empresa</button>
      <span id="status-salvando" class="status-salvando"></span>
    </div>

    <div class="tabela-wrapper">
      <table id="tabela-controle">
        <thead id="tabela-cabecalho"></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>

  </div>

  <!-- ===================== MODAL ADICIONAR/EDITAR EMPRESA ===================== -->
  <div id="modal-empresa" class="modal oculto">
    <div class="modal-conteudo">
      <h3 id="modal-titulo">Adicionar Empresa</h3>
      <div id="modal-campos"></div>
      <div class="modal-botoes">
        <button id="btn-modal-salvar" class="botao-primario">Salvar</button>
        <button id="btn-modal-cancelar" class="botao-secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL CRIAR NOVO MÊS ===================== -->
  <div id="modal-novo-mes" class="modal oculto">
    <div class="modal-conteudo">
      <h3>Criar Novo Mês</h3>
      <p>Digite o nome do novo mês (ex: SETEMBRO):</p>
      <input type="text" id="input-novo-mes" placeholder="SETEMBRO">
      <div class="modal-botoes">
        <button id="btn-criar-mes-confirmar" class="botao-primario">Criar</button>
        <button id="btn-criar-mes-cancelar" class="botao-secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- A ORDEM ABAIXO É OBRIGATÓRIA: meses.js sempre antes de script.js -->
  <script src="meses.js"></script>
  <script src="script.js"></script>
</body>
</html>

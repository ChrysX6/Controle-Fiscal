<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Fiscal - Aguia Contab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== TELA DE LOGIN ===================== -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Logo Aguia Contab" class="login-logo">
      <h2>Controle Fiscal</h2>
      <p>Digite a senha de acesso para continuar</p>
      <input type="password" id="passwordInput" placeholder="Senha de acesso" autocomplete="off">
      <button id="loginBtn">Entrar</button>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <!-- ===================== APP PRINCIPAL ===================== -->
  <div id="app" class="app-hidden">

    <header class="header">
      <div class="header-left">
        <img src="https://chrysx6.github.io/LinksAguiaContab/links/img/logo1.jpg" alt="Logo Aguia Contab" class="logo">
        <h1>Controle de Fechamento Fiscal</h1>
      </div>
      <div class="header-right">
        <button id="openSheetBtn" class="btn btn-secondary">📄 Abrir Planilha</button>
        <button id="logoutBtn" class="btn btn-danger">Sair</button>
      </div>
    </header>

    <nav class="month-tabs" id="monthTabs">
      <!-- Preenchido dinamicamente via meses.js -->
    </nav>

    <nav class="category-tabs" id="categoryTabs">
      <button class="cat-btn active" data-cat="SERV">SERVIÇOS</button>
      <button class="cat-btn" data-cat="COMIND">COMÉRCIO / INDÚSTRIA</button>
      <button class="cat-btn" data-cat="ASSOC">ASSOCIAÇÕES</button>
      <button class="cat-btn" data-cat="SM">SM</button>
    </nav>

    <div class="toolbar">
      <button id="addCompanyBtn" class="btn btn-primary">➕ Adicionar Empresa</button>
      <button id="createMonthBtn" class="btn btn-secondary">🗓️ Criar Novo Mês</button>
      <button id="refreshBtn" class="btn btn-secondary">🔄 Atualizar</button>
      <div class="summary" id="summary"></div>
    </div>

    <div id="loadingIndicator" class="loading-indicator" style="display:none;">Carregando dados...</div>

    <div class="table-wrapper">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </div>

  <!-- ===================== MODAL EDITAR/ADICIONAR EMPRESA ===================== -->
  <div id="companyModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="modalTitle">Adicionar Empresa</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button id="modalSaveBtn" class="btn btn-primary">Salvar</button>
        <button id="modalCancelBtn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ===================== MODAL CRIAR NOVO MÊS ===================== -->
  <div id="monthModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>Criar Novo Mês</h3>
      <label>Nome do mês (ex: AGOSTO)</label>
      <input type="text" id="newMonthName" placeholder="AGOSTO">
      <div class="modal-actions">
        <button id="monthSaveBtn" class="btn btn-primary">Criar</button>
        <button id="monthCancelBtn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="meses.js"></script>
  <script src="script.js"></script>
</body>
</html>
